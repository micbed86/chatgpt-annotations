name: Assemble content script

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/assemble-content.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble and verify content.js
        shell: bash
        run: |
          set -euo pipefail
          {
            cat .parts/content.b64.part00
            head -c 14000 .parts/content.b64.part01
            cat .parts/content.b64.part02
            cat .parts/content.b64.part03
            cat .parts/content.b64.part04
            cat .parts/content.b64.part05
          } | base64 --decode > content.js
          echo "fe597ef0ed5c07ae782d45036b752d24cc577e29ce61e09b07acc55307dbc9fb  content.js" | sha256sum --check -
          node --check content.js

      - name: Commit assembled source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .parts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add content script"
          git push
